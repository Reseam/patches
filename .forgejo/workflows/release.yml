name: release

on:
  push:
    tags:
      - 'v*'
  # Builds the release as CI build 0.0.<run> without uploading, to validate a release or warm the caches.
  workflow_dispatch:

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: cimg/android:2026.03-node
    env:
      ENGINE_VERSION: v0.12.0
      RESEAM_BIN: engine/reseam-linux-x64
      RESEAM_BUNDLE_KEY: bundle-signing.key
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Releases run on tags, which setup-gradle treats as read-only by default.
      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Cache the Reseam CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: engine
          key: reseam-cli-${{ env.ENGINE_VERSION }}

      - name: Download the Reseam CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: download
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ env.ENGINE_VERSION }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: engine

      - name: Install the signing key
        run: |
          chmod +x engine/reseam-linux-x64
          echo "${{ secrets.BUNDLE_SIGNING_KEY_B64 }}" | base64 -d > bundle-signing.key

      - name: Build and stage the release
        run: ./gradlew stageRelease -PreleaseTag=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.{0}', github.run_number) }} --no-daemon

      - name: Upload to the Forgejo release
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/patches
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: build/reseam/release
          override: true
