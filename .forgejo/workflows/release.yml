name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: docker
    container:
      image: ghcr.io/cirruslabs/android-sdk:34
    env:
      ENGINE_VERSION: v0.3.0
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      RESEAM_BIN: engine/reseam-linux-x64
      RESEAM_BUNDLE_KEY: bundle-signing.key
    steps:
      - name: Install Java and Node for the actions
        run: apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless nodejs ca-certificates

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5

      - name: Download the Reseam CLI
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: download
          url: https://git.reseam.app
          repo: reseam/reseam
          tag: ${{ env.ENGINE_VERSION }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: engine

      - name: Install the signing key
        run: |
          chmod +x engine/reseam-linux-x64
          echo "${{ secrets.BUNDLE_SIGNING_KEY_B64 }}" | base64 -d > bundle-signing.key

      - name: Build and stage the release
        run: ./gradlew stageRelease -PreleaseTag=${{ github.ref_name }} --no-daemon

      - name: Upload to the Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: upload
          url: https://git.reseam.app
          repo: reseam/patches
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: build/release
          override: true
